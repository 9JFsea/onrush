<title>OnPush</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e89820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OnPush">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap">

<style>
  :root {
    --bg: #0d0b09;
    --surface: #1a1410;
    --card: #241c12;
    --fb-bg: linear-gradient(135deg, #3d2b18 0%, #2e1f0e 100%);
    --nut: #e8d8a8;
    --fret-color: #7a7a68;
    --string-6: #c0a050;
    --string-1: #d4c080;
    --fg: #f0e6d2;
    --fg-dim: #8a7860;
    --accent: #e89820;
    --correct: #4a9e50;
    --wrong: #c84040;
    --highlight: #3a80c8;
    --dot-marker: rgba(255,255,255,0.18);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5efe5; --surface: #ece3d5; --card: #e0d5c2;
      --fb-bg: linear-gradient(135deg, #6a4828 0%, #4e3218 100%);
      --nut: #f0e8d0; --fret-color: #6a6a58; --string-6: #b89040; --string-1: #c8aa60;
      --fg: #1a1208; --fg-dim: #6a5840; --accent: #c07810;
      --correct: #2e7d32; --wrong: #c62828; --highlight: #1565c0;
      --dot-marker: rgba(255,255,255,0.3); color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5efe5; --surface: #ece3d5; --card: #e0d5c2;
    --fb-bg: linear-gradient(135deg, #6a4828 0%, #4e3218 100%);
    --nut: #f0e8d0; --fret-color: #6a6a58; --string-6: #b89040; --string-1: #c8aa60;
    --fg: #1a1208; --fg-dim: #6a5840; --accent: #c07810;
    --correct: #2e7d32; --wrong: #c62828; --highlight: #1565c0;
    --dot-marker: rgba(255,255,255,0.3); color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: 'Noto Sans JP', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: stretch;
    padding: 0 0 40px; min-height: 100%; width: 100%; overflow-x: hidden;
  }

  header { width: 100%; text-align: center; padding: 20px 16px 10px; }
  h1 { margin: 0 0 2px; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.03em; color: var(--accent); }
  .subtitle { margin: 0; font-size: 0.8rem; color: var(--fg-dim); }

  .tabs {
    display: flex; gap: 3px; background: var(--surface); border-radius: 12px;
    padding: 4px; margin: 12px auto 0; max-width: 580px; width: calc(100% - 32px);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1; padding: 8px 3px; border: none; border-radius: 8px;
    background: transparent; color: var(--fg-dim); font-family: inherit;
    font-size: 0.68rem; font-weight: 700; cursor: pointer;
    transition: background 0.15s, color 0.15s; line-height: 1.25; white-space: nowrap;
  }
  .tab.active { background: var(--accent); color: #fff; }
  .tab:hover:not(.active) { background: var(--card); color: var(--fg); }

  .score-bar {
    display: flex; gap: 24px; justify-content: center; align-items: center; padding: 8px 0 4px;
    width: 100%;
  }
  .score-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .score-lbl { font-size: 0.68rem; color: var(--fg-dim); letter-spacing: 0.06em; text-transform: uppercase; }
  .score-val { font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .score-val.good { color: var(--correct); }
  .score-val.bad  { color: var(--wrong); }
  .score-val.neu  { color: var(--fg); }

  .quiz-prompt {
    background: var(--card); border-radius: 14px; padding: 14px 24px;
    margin: 10px auto 0; text-align: center; max-width: 580px; width: calc(100% - 32px);
  }
  .q-label { font-size: 0.72rem; color: var(--fg-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .q-note { font-size: 2.8rem; font-weight: 800; color: var(--accent); line-height: 1; margin: 2px 0 4px; }
  .q-sub { font-size: 0.82rem; color: var(--fg-dim); }

  .explore-hint { text-align: center; font-size: 0.84rem; color: var(--fg-dim); padding: 8px 16px 0; max-width: 580px; margin: 0 auto; }

  .explore-controls {
    display: flex; gap: 8px; justify-content: center; align-items: center;
    flex-wrap: wrap; padding: 8px 16px 0; max-width: 580px; margin: 0 auto;
  }
  .toggle-all-btn {
    padding: 7px 18px; border-radius: 8px; border: 2px solid var(--fg-dim);
    background: var(--card); color: var(--fg); font-family: inherit;
    font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.12s;
  }
  .toggle-all-btn:hover { border-color: var(--accent); background: rgba(232,152,32,0.12); }
  .toggle-all-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .clear-btn {
    padding: 7px 18px; border-radius: 8px; border: 2px solid var(--fg-dim);
    background: transparent; color: var(--fg-dim); font-family: inherit;
    font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.12s;
  }
  .clear-btn:hover { border-color: var(--fg); color: var(--fg); }

  .scale-panel {
    background: var(--card); border-radius: 12px; padding: 12px 16px;
    margin: 8px auto 0; max-width: 580px; width: calc(100% - 32px);
  }
  .scale-panel-title {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg-dim); margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center; gap: 6px; list-style: none;
  }
  summary.scale-panel-title { cursor: pointer; user-select: none; margin-bottom: 0; }
  summary.scale-panel-title::-webkit-details-marker { display: none; }
  summary.scale-panel-title::marker { content: ''; }
  summary.scale-panel-title::after { content: '▴'; font-size: 0.6rem; opacity: 0.6; transition: transform 0.18s; }
  details:not([open]) summary.scale-panel-title::after { transform: rotate(180deg); }
  details[open] summary.scale-panel-title { margin-bottom: 8px; }
  details > *:not(summary) { animation: panel-open 0.15s ease-out; }
  @keyframes panel-open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .scale-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .scale-lbl { font-size: 0.78rem; font-weight: 600; color: var(--fg-dim); }
  .scale-select {
    padding: 6px 10px; border-radius: 7px; border: 1.5px solid var(--fg-dim);
    background: var(--surface); color: var(--fg); font-family: inherit; font-size: 0.82rem;
    cursor: pointer; transition: border-color 0.12s;
  }
  .scale-select:focus { outline: none; border-color: var(--accent); }
  .scale-toggle-btn {
    padding: 7px 18px; border-radius: 8px; border: 2px solid var(--accent);
    background: transparent; color: var(--accent); font-family: inherit;
    font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.12s;
  }
  .scale-toggle-btn:hover, .scale-toggle-btn.active { background: var(--accent); color: #fff; }

  .chord-panel {
    background: var(--card); border-radius: 12px; padding: 12px 16px;
    margin: 8px auto 0; max-width: 580px; width: calc(100% - 32px);
  }
  .chord-cat-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 8px; }
  .chord-cat-btn {
    padding: 4px 8px; border-radius: 6px; border: 1.5px solid var(--fg-dim);
    background: var(--surface); color: var(--fg-dim); font-family: inherit;
    font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all 0.12s; white-space: nowrap;
  }
  .chord-cat-btn.active { border-color: var(--accent); background: rgba(232,152,32,0.15); color: var(--accent); }
  .chord-btn-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  .chord-btn {
    padding: 6px 12px; border-radius: 7px; border: 1.5px solid var(--fg-dim);
    background: var(--surface); color: var(--fg); font-family: inherit;
    font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.12s;
    min-width: 52px; text-align: center;
  }
  .chord-btn:hover { border-color: var(--accent); color: var(--accent); }
  .chord-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chord-desc { font-size: 0.75rem; color: var(--fg-dim); text-align: center; margin-top: 8px; line-height: 1.6; min-height: 1.2em; }
  .cd-mute { color: #e05555; font-weight: 700; }
  .cd-open { color: #4a90d9; font-weight: 700; }

  /* ボードタグ */
  .board-tag-row {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 2px; max-width: 620px; margin: 0 auto; width: 100%;
  }
  .board-tag {
    font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em;
    padding: 3px 10px; border-radius: 5px; color: #fff; text-transform: uppercase;
  }
  .board-tag.tag-a { background: var(--accent); }
  .board-tag.tag-b { background: var(--highlight); }
  .board-tag-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
  .board-toggle-btn {
    padding: 3px 10px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent; color: var(--fg-dim); font-family: inherit;
    font-size: 0.68rem; font-weight: 700; cursor: pointer; letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .board-toggle-btn:hover { border-color: var(--highlight); color: var(--highlight); }
  .board-toggle-btn.is-off { border-color: var(--fg-dim); opacity: 0.5; }

  .board-divider {
    border: none; border-top: 2px dashed rgba(255,255,255,0.06);
    margin: 20px 16px 0; width: calc(100% - 32px); max-width: 620px;
  }

  .str-label.muted { color: var(--wrong) !important; }
  .note-dot.scale-root { border: 2.5px solid rgba(255,255,255,0.9) !important; box-shadow: 0 0 14px currentColor !important; }

  .note-legend {
    display: flex; flex-wrap: wrap; gap: 5px; justify-content: center;
    padding: 10px 16px 0; max-width: 580px; margin: 0 auto; width: calc(100% - 32px);
  }
  .legend-badge {
    padding: 5px 10px; border-radius: 7px; font-size: 0.78rem; font-weight: 700;
    color: #fff; letter-spacing: 0.01em; transition: opacity 0.2s, transform 0.15s, box-shadow 0.15s;
    cursor: default; user-select: none;
  }
  .legend-badge.dimmed { opacity: 0.18; }
  .legend-badge.scale-root-badge { box-shadow: 0 0 0 2.5px rgba(255,255,255,0.85); }

  .fb-wrapper {
    width: 100%; overflow-x: auto; padding: 12px 16px 0;
    -webkit-overflow-scrolling: touch; scroll-snap-type: none;
    touch-action: pan-x pan-y;
  }
  .fretboard {
    background: var(--fb-bg); border-radius: 10px; border: 2px solid rgba(0,0,0,0.5);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.4);
    min-width: 720px; padding: 10px 8px; position: relative;
  }
  .fb-grid { display: grid; grid-template-columns: 38px 40px repeat(12, 1fr); }
  .fb-pos-markers { display: grid; grid-template-columns: 38px 40px repeat(12, 1fr); margin-bottom: 4px; }
  .pos-cell { display: flex; justify-content: center; align-items: center; height: 14px; }
  .pos-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot-marker); }
  .pos-dot-double { display: flex; gap: 4px; }
  .fb-fret-nums { display: grid; grid-template-columns: 38px 40px repeat(12, 1fr); margin-bottom: 6px; }
  .fret-num { text-align: center; font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; }
  .string-row { display: contents; }
  .str-label { display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.5); position: relative; z-index: 2; }
  .nut-col { position: relative; display: flex; align-items: center; justify-content: center; }
  .nut-col::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 5px;
    background: var(--nut); border-radius: 2px; box-shadow: 0 0 6px rgba(232,216,168,0.3);
  }
  .fret-cell { position: relative; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .fret-cell::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 1; }
  .fret-cell:not(:last-of-type)::after {
    content: ''; position: absolute; right: 0; top: 4px; bottom: 4px;
    width: 2px; background: var(--fret-color); z-index: 2; box-shadow: 0 0 2px rgba(0,0,0,0.4);
  }
  [data-si="0"] .fret-cell::before { height: 3px;   background: var(--string-6); }
  [data-si="1"] .fret-cell::before { height: 2.5px; background: #c0a858; }
  [data-si="2"] .fret-cell::before { height: 2px;   background: #c8b060; }
  [data-si="3"] .fret-cell::before { height: 1.5px; background: #ccc070; }
  [data-si="4"] .fret-cell::before { height: 1.5px; background: var(--string-1); }
  [data-si="5"] .fret-cell::before { height: 1px;   background: var(--string-1); }
  .open-cell { position: relative; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .open-cell::before { content: ''; position: absolute; right: 0; left: 50%; top: 50%; transform: translateY(-50%); z-index: 1; }
  [data-si="0"] .open-cell::before { height: 3px;   background: var(--string-6); }
  [data-si="1"] .open-cell::before { height: 2.5px; background: #c0a858; }
  [data-si="2"] .open-cell::before { height: 2px;   background: #c8b060; }
  [data-si="3"] .open-cell::before { height: 1.5px; background: #ccc070; }
  [data-si="4"] .open-cell::before { height: 1.5px; background: var(--string-1); }
  [data-si="5"] .open-cell::before { height: 1px;   background: var(--string-1); }
  .note-dot {
    position: relative; z-index: 3; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 700; letter-spacing: -0.01em;
    transition: background 0.12s, box-shadow 0.12s, transform 0.1s; user-select: none;
  }
  .fret-cell:hover .note-dot, .open-cell:hover .note-dot {
    background: rgba(232,152,32,0.25); color: var(--accent); transform: scale(1.1);
  }
  .note-dot.show { background: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(232,152,32,0.55); }
  .note-dot.highlighted { background: var(--highlight); color: #fff; box-shadow: 0 0 14px rgba(58,128,200,0.7); animation: pulse 1.2s ease-in-out infinite; }
  .note-dot.correct-ans { background: var(--correct); color: #fff; box-shadow: 0 0 12px rgba(74,158,80,0.65); animation: pop 0.25s ease-out; }
  .note-dot.wrong-ans { background: var(--wrong); color: #fff; animation: shake 0.3s ease-out; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(58,128,200,0.5); transform: scale(1); }
    50%       { box-shadow: 0 0 22px rgba(58,128,200,0.9); transform: scale(1.08); }
  }
  @keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-5px); } 70% { transform: translateX(5px); } }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 16px 4px; max-width: 480px; margin: 0 auto; }
  .choice-btn {
    padding: 10px 18px; min-width: 64px; border-radius: 10px; border: 2px solid var(--fg-dim);
    background: var(--card); color: var(--fg); font-family: inherit; font-size: 1rem;
    font-weight: 700; cursor: pointer; transition: all 0.1s;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(232,152,32,0.12); transform: scale(1.05); }
  .choice-btn.correct { background: var(--correct); border-color: var(--correct); color: #fff; }
  .choice-btn.wrong-pick { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .choice-btn:disabled { cursor: default; }

  .next-btn {
    display: none; margin: 10px auto 0; padding: 11px 36px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-family: inherit; font-size: 0.95rem;
    font-weight: 700; cursor: pointer; transition: opacity 0.1s, transform 0.1s;
  }
  .next-btn:hover { opacity: 0.85; transform: scale(1.03); }
  .next-btn.visible { display: block; }

  /* ===== Metronome ===== */
  .metro-bpm-row { display:flex; align-items:center; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; }
  .metro-adj-btn {
    width:30px; height:30px; border-radius:6px; border:1.5px solid var(--fg-dim);
    background:var(--card); color:var(--fg); font-size:1.1rem; cursor:pointer;
    font-family:inherit; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:border-color 0.12s;
  }
  .metro-adj-btn:hover { border-color:var(--accent); }
  .metro-bpm-box { display:flex; flex-direction:column; align-items:center; min-width:54px; }
  .metro-bpm-val { font-size:1.6rem; font-weight:800; line-height:1; }
  .metro-bpm-lbl { font-size:0.58rem; color:var(--fg-dim); letter-spacing:0.1em; text-transform:uppercase; }
  .metro-sig-lbl { font-size:0.78rem; color:var(--fg-dim); font-weight:600; }
  .metro-sig-ctrl { display:flex; align-items:center; gap:4px; }
  .metro-sig-btn { width:24px; height:24px; font-size:0.9rem; }
  .metro-sig-val { font-size:1.2rem; font-weight:700; min-width:20px; text-align:center; }
  .metro-sig-sep { font-size:1.2rem; font-weight:700; color:var(--fg-dim); padding:0 2px; }
  .metro-beats { display:flex; gap:8px; justify-content:center; padding:8px 0; flex-wrap:wrap; }
  .metro-beat-dot {
    width:13px; height:13px; border-radius:50%;
    background:var(--surface); border:2px solid var(--fg-dim);
    transition:background 0.06s, border-color 0.06s;
  }
  .metro-beat-dot.active { background:var(--accent); border-color:var(--accent); }
  .metro-beat-dot.downbeat.active { background:var(--correct); border-color:var(--correct); transform:scale(1.2); }
  .metro-link-row { display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:6px; flex-wrap:wrap; }

  /* ===== Progression ===== */
  .prog-steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 8px 0 4px; }
  .prog-step-btn {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 7px 12px; border-radius: 8px; border: 1.5px solid var(--fg-dim);
    background: var(--surface); color: var(--fg); font-family: inherit;
    cursor: pointer; transition: all 0.12s; min-width: 52px; text-align: center;
  }
  .prog-step-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .prog-step-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .prog-roman { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em; color: var(--fg-dim); }
  .prog-step-btn.active .prog-roman { color: rgba(255,255,255,0.75); }
  .prog-chord-name { font-size: 0.88rem; font-weight: 700; }

  /* ===== Tuner ===== */
  #tunerArea { max-width: 580px; margin: 20px auto 0; padding: 0 16px; width: calc(100% - 32px); }
  #sketchArea { max-width: 580px; margin: 16px auto 0; padding: 0 16px; width: calc(100% - 32px); }
  .sketch-card { background: var(--card); border-radius: 16px; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .sketch-title-input { width: 100%; font-size: 1.05rem; font-weight: 700; font-family: inherit; background: transparent; border: none; border-bottom: 1.5px solid var(--fg-dim); color: var(--fg); padding: 4px 0; outline: none; }
  .sketch-title-input::placeholder { color: var(--fg-dim); font-weight: 400; }
  .sketch-section-label { font-size: 0.7rem; font-weight: 700; color: var(--fg-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
  .sketch-prog-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .sketch-chords { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 36px; padding: 4px 0; }
  .sketch-chord-chip { padding: 6px 14px; border-radius: 20px; background: var(--surface); border: 1.5px solid var(--fg-dim); font-weight: 700; font-size: 0.88rem; cursor: default; transition: all 0.15s; }
  .sketch-chord-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sketch-custom-row { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .sketch-custom-slots { display: flex; gap: 6px; flex-wrap: wrap; }

  'E5':[0,2,2,-1,-1,-1],'F5':[1,3,3,-1,-1,-1],'G5':[3,5,5,-1,-1,-1],

  'Csus2':[-1,3,0,0,3,3],'Dsus2':[-1,-1,0,2,3,0],'Esus2':[0,2,4,4,0,0],

  'Csus4':[-1,3,3,0,1,1],'Dsus4':[-1,-1,0,2,3,3],'Esus4':[0,2,2,2,0,0],

  'Cadd9':[-1,3,2,0,3,0],'Dadd9':[-1,-1,0,2,3,2],'Eadd9':[0,2,2,1,0,2],
  'Gadd9':[3,2,0,2,0,3],'Aadd9':[-1,0,2,4,2,0],

  'Adim':[-1,0,1,2,1,2],'Bdim':[-1,2,3,1,3,1],
  'Caug':[-1,3,2,1,1,0],'Daug':[-1,-1,0,3,3,2],'Eaug':[0,3,2,1,1,0],

  'F#':[2,4,4,3,2,2],'Bb':[-1,1,3,3,3,1],

const CHORD_CATEGORIES = {
  'M':   ['C','D','E','F','G','A','B'],
  'm':   ['Cm','Dm','Em','Fm','Gm','Am','Bm'],
  '7':   ['C7','D7','E7','F7','G7','A7','B7'],
  'M7':  ['Cmaj7','Dmaj7','Emaj7','Fmaj7','Gmaj7','Amaj7','Bmaj7'],

  'P5':  ['E5','F5','G5','A5','B5','C5','D5'],
  'sus2':['Csus2','Dsus2','Esus2','Fsus2','Gsus2','Asus2','Bsus2'],
  'sus4':['Csus4','Dsus4','Esus4','Fsus4','Gsus4','Asus4','Bsus4'],

  'aug': ['Caug','Daug','Eaug','Gaug','Aaug','Baug'],

const SCALES = {
  'メジャー':[0,2,4,5,7,9,11],'マイナー':[0,2,3,5,7,8,10],
  'ペンタ（メジャー）':[0,2,4,7,9],'ペンタ（マイナー）':[0,3,5,7,10],
  'ブルース':[0,3,5,6,7,10],'ドリアン':[0,2,3,5,7,9,10],
  'ミクソリディアン':[0,2,4,5,7,9,10],'フリジアン':[0,1,3,5,7,8,10],
};
const PROG_KEY_NI = {'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11};
const PROGRESSIONS = {
  'I – IV – V':      [{d:0,q:'',r:'I'},{d:5,q:'',r:'IV'},{d:7,q:'',r:'V'}],
  'I – V – vi – IV': [{d:0,q:'',r:'I'},{d:7,q:'',r:'V'},{d:9,q:'m',r:'vi'},{d:5,q:'',r:'IV'}],
  'vi – IV – I – V': [{d:9,q:'m',r:'vi'},{d:5,q:'',r:'IV'},{d:0,q:'',r:'I'},{d:7,q:'',r:'V'}],
  'I – vi – IV – V': [{d:0,q:'',r:'I'},{d:9,q:'m',r:'vi'},{d:5,q:'',r:'IV'},{d:7,q:'',r:'V'}],
  'ii – V – I':      [{d:2,q:'m',r:'ii'},{d:7,q:'',r:'V'},{d:0,q:'',r:'I'}],
};

const NOTE_COLORS = [
  '#ff4a4a','#ff7830','#ffb020','#c8d020','#72c820','#20b850',
  '#18b8a8','#2890e8','#6055ff','#a038ff','#d825b8','#ff3080',
];
const STRINGS = [
  {name:'E',ni:4, freq:82.41 },
  {name:'A',ni:9, freq:110.00},
  {name:'D',ni:2, freq:146.83},
  {name:'G',ni:7, freq:196.00},
  {name:'B',ni:11,freq:246.94},
  {name:'E',ni:4, freq:329.63},
];
const NUM_FRETS = 13;

// Global state
let mode = 'explore';
let quiz = null;
let score = { ok: 0, ng: 0 };
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playNote(freq) {
  const ctx = ensureAudio();
  const now = ctx.currentTime;
  [[1,0.5,'sawtooth'],[2,0.25,'sawtooth'],[3,0.1,'sine'],[0.5,0.1,'sine']].forEach(([h,g,type]) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain(), lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass'; lpf.frequency.value = 3200;
    osc.type = type; osc.frequency.value = freq * h;
    gain.gain.setValueAtTime(g * 0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2);
    osc.connect(lpf); lpf.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 2);
  });
}
function noteFreq(si, fret)  { return STRINGS[si].freq * Math.pow(2, fret / 12); }
function noteName(si, fret)  { return NOTES[(STRINGS[si].ni + fret) % 12]; }
function noteColor(si, fret) { return NOTE_COLORS[(STRINGS[si].ni + fret) % 12]; }
function strumChord(name) {
  const frets = CHORD_FORMS[name]; if (!frets) return; ensureAudio();
  frets.forEach((fret, si) => { if (fret < 0) return; setTimeout(() => playNote(noteFreq(si, fret)), si * 40); });
}

// ===== Board factory =====
function makeBoard(bid) {
  let bShowAll = false, bScaleActive = false, bSelectedChord = null;
  let progAutoInterval = null, progStepIdx = 0, progSteps = [];
  let metroBPM = 80, metroBeats = 4, metroCurrentBeat = -1;
  let metroNumerator = 4, metroDenominator = 4;
  let metroSchedTimer = null, metroNextTime = 0, metroNextBeat = 0, metroBar = 0;

  const p  = id => `${bid}-${id}`;
  const el = id => document.getElementById(p(id));
  const getDot = (si, fret) => document.getElementById(p(`dot-${si}-${fret}`));

  function showDot(si, fret, text, cls) {
    const d = getDot(si, fret); if (!d) return;
    d.className = `note-dot ${cls}`; d.textContent = text;
    if (['show','correct-ans','scale-note','scale-root','chord-in-scale'].includes(cls)) {
      const col = noteColor(si, fret);
      d.style.background = col; d.style.boxShadow = `0 0 10px ${col}99`; d.style.color = '#fff';
    } else if (cls === 'chord-out-scale') {
      d.style.background = '#c84040'; d.style.boxShadow = '0 0 8px rgba(200,64,64,0.55)'; d.style.color = '#fff';
    } else if (cls === 'scale-dim') {
      d.style.background = 'rgba(255,255,255,0.07)'; d.style.boxShadow = ''; d.style.color = 'rgba(255,255,255,0.28)';
    } else { d.style.background = ''; d.style.boxShadow = ''; d.style.color = ''; }
  }
  function clearDot(si, fret) {
    const d = getDot(si, fret); if (!d) return;
    d.className = 'note-dot'; d.textContent = '';
    d.style.background = ''; d.style.boxShadow = ''; d.style.color = ''; d.style.border = '';
  }
  function clearAll() { STRINGS.forEach((_,si) => { for (let f=0;f<NUM_FRETS;f++) clearDot(si,f); }); }

  function resetStringLabels() {
    STRINGS.forEach((str, si) => {
      const lbl = el(`str-lbl-${si}`); if (!lbl) return;
      lbl.textContent = `${si===0?6:6-si}弦\n${str.name}`; lbl.classList.remove('muted');
    });
  }

  function updateLegend(scaleSet, rootNi) {
    NOTES.forEach((_, ni) => {
      const badge = el(`legend-${ni}`); if (!badge) return;
      if (scaleSet === null) { badge.classList.remove('dimmed','scale-root-badge'); }
      else if (scaleSet.has(ni)) { badge.classList.remove('dimmed'); badge.classList.toggle('scale-root-badge', ni===rootNi); }
      else { badge.classList.add('dimmed'); badge.classList.remove('scale-root-badge'); }
    });
  }

  function redraw() {
    clearAll(); resetStringLabels();
    if (!bScaleActive && !bSelectedChord) { updateLegend(null, null); return; }

    const rootNi = bScaleActive ? parseInt(el('scaleRoot').value) : null;
    const scaleSet = bScaleActive
      ? new Set(SCALES[el('scaleType').value].map(i => (rootNi + i) % 12))
      : null;

    let chordNoteSet = null;
    if (bSelectedChord) {
      const frets = CHORD_FORMS[bSelectedChord] || [];
      chordNoteSet = new Set();
      frets.forEach((fret, si) => { if (fret >= 0) chordNoteSet.add((STRINGS[si].ni + fret) % 12); });
      frets.forEach((fret, si) => {
        const lbl = el(`str-lbl-${si}`);
        if (fret === -1 && lbl) { lbl.textContent = `${si===0?6:6-si}弦\n×`; lbl.classList.add('muted'); }
      });
    }

    if (bScaleActive && bSelectedChord) {
      const chordFrets = CHORD_FORMS[bSelectedChord] || [];
      const chordFormSet = new Set();
      chordFrets.forEach((fret, si) => { if (fret >= 0) chordFormSet.add(`${si}-${fret}`); });
      STRINGS.forEach((str, si) => {
        for (let f = 0; f < NUM_FRETS; f++) {
          const ni = (str.ni + f) % 12;
          const inScale = scaleSet.has(ni);
          if (chordFormSet.has(`${si}-${f}`)) {
            const deg = INTERVAL_NAMES[(ni - rootNi + 12) % 12];
            showDot(si, f, deg, inScale ? 'chord-in-scale' : 'chord-out-scale');
          } else if (inScale) {
            showDot(si, f, noteName(si, f), 'scale-dim');
          }
        }
      });
      updateLegend(scaleSet, rootNi);
    } else if (bScaleActive) {
      STRINGS.forEach((str, si) => {
        for (let f = 0; f < NUM_FRETS; f++) {
          const ni = (str.ni + f) % 12;
          if (scaleSet.has(ni)) showDot(si, f, noteName(si, f), ni === rootNi ? 'scale-root' : 'scale-note');
        }
      });
      updateLegend(scaleSet, rootNi);
    } else {
      const frets = CHORD_FORMS[bSelectedChord] || [];
      frets.forEach((fret, si) => {
        if (fret >= 0) showDot(si, fret, noteName(si, fret), 'show');
      });
      updateLegend(chordNoteSet, null);
    }
  }

  function applyScale() { redraw(); }

  function clearChord() {
    bSelectedChord = null;
    document.querySelectorAll(`#${p('chord-btn-row')} .chord-btn`).forEach(b => b.classList.remove('selected'));
    const cd = el('chord-desc'); if (cd) cd.textContent = '';
    redraw();
  }

  function showChordDesc(name) {
    const cd = el('chord-desc'); if (!cd) return;
    const frets = CHORD_FORMS[name]; if (!frets) { cd.innerHTML = ''; return; }
    const labels = ['6弦','5弦','4弦','3弦','2弦','1弦'];
    cd.innerHTML = frets.map((f, i) => {
      const s = labels[i];
      if (f < 0) return `<span class="cd-mute">${s}ミ</span>`;
      if (f === 0) return `<span class="cd-open">${s}開</span>`;
      return `<span>${s}${f}フレ</span>`;
    }).join('<span class="cd-sep">　</span>');
  }

  function showChord(name) {
    strumChord(name);
    bSelectedChord = name;
    document.querySelectorAll(`#${p('chord-btn-row')} .chord-btn`).forEach(b => b.classList.toggle('selected', b.dataset.chord === name));

    bScaleActive = !bScaleActive;

      btn.textContent = '消す'; btn.classList.add('active');

  function onCellClick(si, fret) {
    if (bid==='a' && mode==='note-quiz') {
      if (!quiz || quiz.answered) return;
      const ok = quiz.correctPositions.some(pos => pos.si===si && pos.f===fret);
      quiz.answered = true;
      showDot(si,fret,noteName(si,fret), ok?'correct-ans':'wrong-ans');
      playNote(noteFreq(si,fret));
      quiz.correctPositions.forEach(pos => {
        if (pos.si===si && pos.f===fret) return;
        showDot(pos.si,pos.f,quiz.name,'correct-ans');
      });
      if (ok) score.ok++; else score.ng++;
      updateScore();
      document.getElementById('nextBtn').classList.add('visible');
      return;
    }
    if (bid==='a' && mode==='fret-quiz') return;
    if (bShowAll || bScaleActive || bSelectedChord) { playNote(noteFreq(si,fret)); return; }
    const dot = getDot(si,fret);
    if (dot && dot.classList.contains('show')) clearDot(si,fret);
    else { showDot(si,fret,noteName(si,fret),'show'); playNote(noteFreq(si,fret)); }
  }

      document.querySelectorAll(`#${p('chord-btn-row')} .chord-btn`).forEach(b=>b.classList.remove('selected'));

      <select class="scale-select" id="${p('scaleType')}">${Object.keys(SCALES).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
      <button class="scale-toggle-btn" id="${p('scaleToggleBtn')}">表示</button>

    el('scaleType').addEventListener('change', ()=>{ if(bScaleActive) applyScale(); });

    const cp = document.createElement('details'); cp.className='chord-panel'; cp.open=true;
    const ct = document.createElement('summary'); ct.className='scale-panel-title'; ct.textContent='コード表示'; cp.appendChild(ct);

    const prow = document.createElement('div'); prow.className = 'scale-row'; prow.style.marginBottom = '8px';
    prow.innerHTML = `<span class="scale-lbl">キー</span>
      <select class="scale-select" id="${p('progRoot')}">${Object.keys(PROG_KEY_NI).map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
      <span class="scale-lbl">パターン</span>

      <button class="metro-adj-btn" id="${p('bpmUp')}">＋</button>
      <span class="metro-sig-lbl">拍子</span>
      <div class="metro-sig-ctrl">
        <button class="metro-adj-btn metro-sig-btn" id="${p('numDn')}">－</button>
        <span class="metro-sig-val" id="${p('metroNum')}">4</span>
        <button class="metro-adj-btn metro-sig-btn" id="${p('numUp')}">＋</button>
        <span class="metro-sig-sep">/</span>
        <button class="metro-adj-btn metro-sig-btn" id="${p('denDn')}">－</button>
        <span class="metro-sig-val" id="${p('metroDen')}">4</span>
        <button class="metro-adj-btn metro-sig-btn" id="${p('denUp')}">＋</button>
      </div>`;
    mp.appendChild(mbpmRow);

    for (let i = 0; i < metroBeats; i++) {
      const d = document.createElement('div'); d.className = 'metro-beat-dot' + (i===0?' downbeat':''); mbeats.appendChild(d);
    }

      <select class="scale-select" id="${p('metroBarsPerChord')}">
        <option value="0">なし</option><option value="1">1小節</option>
        <option value="2">2小節</option><option value="4">4小節</option>

    el('numUp').onclick = () => { metroNumerator = Math.min(16, metroNumerator + 1); el('metroNum').textContent = metroNumerator; setTimeSig(metroNumerator, metroDenominator); };
    el('denDn').onclick = () => { const i = DEN_VALS.indexOf(metroDenominator); metroDenominator = DEN_VALS[Math.max(0, i - 1)]; el('metroDen').textContent = metroDenominator; };
    el('denUp').onclick = () => { const i = DEN_VALS.indexOf(metroDenominator); metroDenominator = DEN_VALS[Math.min(DEN_VALS.length - 1, i + 1)]; el('metroDen').textContent = metroDenominator; };
    metroBPM = 80; setTimeSig(4, 4);

  function scheduleClick(time, isDown) {
    const ctx = ensureAudio();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = isDown ? 880 : 660;
    gain.gain.setValueAtTime(isDown ? 0.25 : 0.12, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(time); osc.stop(time + 0.08);
  }
  function updateMetroDots(beat) {
    document.querySelectorAll(`#${p('metro-beats')} .metro-beat-dot`).forEach((d, i) => {
      d.classList.toggle('active', i === beat);
    });
  }
  function metroScheduler() {
    const ctx = ensureAudio();
    const barsEl = el('metroBarsPerChord');
    const barsPerChord = barsEl ? parseInt(barsEl.value) : 0;
    while (metroNextTime < ctx.currentTime + 0.12) {
      const isDown = metroNextBeat === 0;
      scheduleClick(metroNextTime, isDown);
      const bt = metroNextBeat, nt = metroNextTime;
      setTimeout(() => updateMetroDots(bt), Math.max(0, (nt - ctx.currentTime) * 1000 - 20));
      if (isDown && barsPerChord > 0 && progSteps.length > 0 && metroBar % barsPerChord === 0) {
        const nextIdx = metroBar / barsPerChord % progSteps.length | 0;
        const chord = progSteps[nextIdx];
        const delay = Math.max(0, (nt - ctx.currentTime) * 1000);
        setTimeout(() => { progStepIdx = nextIdx; showChord(chord); renderProgressionSteps(); }, delay);
      }
      if (isDown) metroBar++;
      metroNextBeat = (metroNextBeat + 1) % metroBeats;
      metroNextTime += 60 / metroBPM;
    }
  }
  function startMetro() {
    const ctx = ensureAudio();
    metroNextBeat = 0; metroBar = 0;
    metroNextTime = ctx.currentTime + 0.05;
    metroSchedTimer = setInterval(metroScheduler, 25);
    const btn = el('metroBtn'); if (btn) { btn.textContent = '■ 停止'; btn.classList.add('active'); }
  }
  function stopMetro() {
    clearInterval(metroSchedTimer); metroSchedTimer = null;
    updateMetroDots(-1);
    const btn = el('metroBtn'); if (btn) { btn.textContent = '▶ 開始'; btn.classList.remove('active'); }
  }
  function toggleMetro() { metroSchedTimer ? stopMetro() : startMetro(); }
  function adjustBPM(delta) {
    metroBPM = Math.max(40, Math.min(220, metroBPM + delta));
    const v = el('metroBPMVal'); if (v) v.textContent = metroBPM;
  }
  function setTimeSig(beats, den) {
    metroBeats = beats; if (den !== undefined) metroDenominator = den; stopMetro();
    const row = el('metro-beats'); if (!row) return;
    row.innerHTML = '';
    for (let i = 0; i < beats; i++) {
      const d = document.createElement('div');
      d.className = 'metro-beat-dot' + (i === 0 ? ' downbeat' : '');
      row.appendChild(d);
    }
  }
  function stopMetroAll() { stopMetro(); }

  function stopProgAuto() {
    if (progAutoInterval) { clearInterval(progAutoInterval); progAutoInterval = null; }
    const btn = el('prog-auto-btn'); if (btn) { btn.textContent = '▶ 自動'; btn.classList.remove('active'); }
  }
  function renderProgressionSteps() {
    const row = el('prog-steps'); if (!row) return;
    const prog = PROGRESSIONS[el('progType') && el('progType').value] || [];
    row.innerHTML = '';
    progSteps.forEach((chordName, i) => {
      const step = prog[i] || {};
      const btn = document.createElement('button');
      btn.className = 'prog-step-btn' + (i === progStepIdx && bSelectedChord === chordName ? ' active' : '');
      btn.innerHTML = `<span class="prog-roman">${step.r || ''}</span><span class="prog-chord-name">${chordName}</span>`;
      btn.onclick = () => { progStepIdx = i; showChord(chordName); renderProgressionSteps(); };
      row.appendChild(btn);
    });
  }
  function buildProgressionSteps() {
    const typeEl = el('progType'), rootEl = el('progRoot');
    if (!typeEl || !rootEl) return;
    const rootNi = PROG_KEY_NI[rootEl.value] ?? 0;
    const prog = PROGRESSIONS[typeEl.value] || [];
    progSteps = prog.map(s => NOTES[(rootNi + s.d) % 12] + s.q);
    progStepIdx = 0; renderProgressionSteps();
  }
  function toggleProgAuto() {
    if (progAutoInterval) { stopProgAuto(); return; }
    const btn = el('prog-auto-btn'); if (btn) { btn.textContent = '■ 停止'; btn.classList.add('active'); }
    progAutoInterval = setInterval(() => {
      if (!progSteps.length) return;
      progStepIdx = (progStepIdx + 1) % progSteps.length;
      showChord(progSteps[progStepIdx]); renderProgressionSteps();
    }, 2500);
  }

  return { showDot, clearDot, clearAll, resetStringLabels, updateLegend, buildFretboard, buildLegend, renderExploreControls, getDot, stopProgAuto, stopMetroAll, showChord, clearChord };
}

    <div class="quiz-prompt">
      <div class="q-label">このフレットの音名は？</div>
      <div class="q-sub">${si===0?6:6-si}弦 / ${fret===0?'開放弦':fret+'フレット'}</div>
    </div>`;
  const wrong=NOTES.filter(n=>n!==correct).sort(()=>Math.random()-0.5).slice(0,3);
  const choices=[correct,...wrong].sort(()=>Math.random()-0.5);
  const wrap=document.createElement('div'); wrap.className='choices';
  choices.forEach(note=>{
    const btn=document.createElement('button'); btn.className='choice-btn'; btn.textContent=note;
    btn.onclick=()=>answerFretQuiz(note,btn); wrap.appendChild(btn);
  });
  document.getElementById('choicesArea').appendChild(wrap);
}

function answerFretQuiz(chosen,btn) {
  if(quiz.answered) return; quiz.answered=true;
  const ok=chosen===quiz.correct;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===quiz.correct) b.classList.add('correct');
    else if(b===btn&&!ok) b.classList.add('wrong-pick');
  });
  boardA.clearDot(quiz.si,quiz.fret);
  boardA.showDot(quiz.si,quiz.fret,quiz.correct,ok?'correct-ans':'wrong-ans');
  playNote(noteFreq(quiz.si,quiz.fret));
  if(ok) score.ok++; else score.ng++;
  updateScore(); document.getElementById('nextBtn').classList.add('visible');
}

function startNoteQuiz() {
  boardA.clearAll();
  document.getElementById('nextBtn').classList.remove('visible');
  document.getElementById('choicesArea').innerHTML='';
  const ni=Math.floor(Math.random()*12), name=NOTES[ni];
  const correctPositions=[];
  STRINGS.forEach((str,si)=>{ for(let f=0;f<NUM_FRETS;f++) if((str.ni+f)%12===ni) correctPositions.push({si,f}); });
  quiz={type:'note',ni,name,correctPositions,answered:false};
  document.getElementById('promptArea').innerHTML=`
    <div class="quiz-prompt">
      <div class="q-label">この音が出る場所をクリック！</div>
      <div class="q-note">${name}</div>
      <div class="q-sub">どれか1か所でもOK</div>
    </div>`;
}

function nextQuestion() {
  if(mode==='fret-quiz') startFretQuiz();
  else if(mode==='note-quiz') startNoteQuiz();
}

// ===== Tuner =====
let tunerStream = null, tunerAnalyser = null, tunerRAF = null, tunerBuf = null, tunerTick = 0;

function detectPitch(buffer, sampleRate) {
  const SIZE = buffer.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
  if (Math.sqrt(rms / SIZE) < 0.01) return -1;

  let r1 = 0, r2 = SIZE - 1;
  for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buffer[i]) < 0.2) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buffer[SIZE - i]) < 0.2) { r2 = SIZE - i; break; }
  const buf = buffer.slice(r1, r2);
  const N = buf.length;
  if (N < 4) return -1;

  const corr = new Float32Array(N);
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N - i; j++)
      corr[i] += buf[j] * buf[j + i];

  let d = 0;
  while (d < N - 1 && corr[d] > corr[d + 1]) d++;

  let maxVal = -1, maxIdx = -1;
  for (let i = d; i < N; i++) if (corr[i] > maxVal) { maxVal = corr[i]; maxIdx = i; }

  if (maxIdx < 1 || maxIdx >= N - 1 || maxVal / corr[0] < 0.5) return -1;

  const a = corr[maxIdx - 1] + corr[maxIdx + 1] - 2 * corr[maxIdx];
  const b = (corr[maxIdx + 1] - corr[maxIdx - 1]) / 2;
  const period = a ? maxIdx - b / (2 * a) : maxIdx;
  return sampleRate / period;
}

function freqToNoteInfo(freq) {
  if (freq < 50 || freq > 1400) return null;
  const semitones = 12 * Math.log2(freq / 440);
  const midi = Math.round(semitones) + 69;
  const cents = (semitones - Math.round(semitones)) * 100;
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return { name: names[((midi % 12) + 12) % 12], octave: Math.floor(midi / 12) - 1, cents };
}

function updateTunerUI(info) {
  const noteEl = document.getElementById('tunerNote');
  const octEl  = document.getElementById('tunerOct');
  const centEl = document.getElementById('tunerCents');
  const dotEl  = document.getElementById('tunerDot');
  if (!noteEl) return;
  if (!info) {
    noteEl.textContent = '–'; noteEl.style.color = '';
    octEl.textContent = ''; centEl.textContent = '音を鳴らしてください'; centEl.style.color = '';
    if (dotEl) dotEl.style.left = '50%';
    return;
  }
  const cents = info.cents;
  const inTune = Math.abs(cents) < 5, close = Math.abs(cents) < 15;
  const color = inTune ? 'var(--correct)' : close ? 'var(--accent)' : 'var(--wrong)';
  noteEl.textContent = info.name; noteEl.style.color = color;
  octEl.textContent = info.octave;
  centEl.textContent = cents > 0 ? `+${cents.toFixed(1)}¢` : `${cents.toFixed(1)}¢`;
  centEl.style.color = color;
  if (dotEl) dotEl.style.left = Math.max(5, Math.min(95, 50 + (cents / 50) * 45)) + '%';
}

function tunerLoop() {
  tunerRAF = requestAnimationFrame(tunerLoop);
  if (++tunerTick % 4 !== 0 || !tunerAnalyser || !tunerBuf) return;
  tunerAnalyser.getFloatTimeDomainData(tunerBuf);
  const freq = detectPitch(tunerBuf, (audioCtx || { sampleRate: 44100 }).sampleRate);
  updateTunerUI(freq > 0 ? freqToNoteInfo(freq) : null);
}

function toggleTuner() {
  const btn = document.getElementById('tunerBtn');
  if (tunerStream) {
    cancelAnimationFrame(tunerRAF); tunerRAF = null;
    tunerStream.getTracks().forEach(t => t.stop()); tunerStream = null;
    tunerAnalyser = null; tunerBuf = null;
    if (btn) { btn.textContent = 'チューニング開始'; btn.classList.remove('stop'); }
    updateTunerUI(null);
  } else {
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        tunerStream = stream;
        const ctx = ensureAudio();
        const src = ctx.createMediaStreamSource(stream);
        tunerAnalyser = ctx.createAnalyser();
        tunerAnalyser.fftSize = 2048;
        src.connect(tunerAnalyser);
        tunerBuf = new Float32Array(tunerAnalyser.fftSize);
        tunerTick = 0; tunerLoop();
        if (btn) { btn.textContent = '停止'; btn.classList.add('stop'); }
      })
      .catch(() => {
        const c = document.getElementById('tunerCents');
        if (c) c.textContent = 'マイクの許可が必要です';
      });
  }
}

function stopTuner() {
  if (!tunerStream) return;
  cancelAnimationFrame(tunerRAF); tunerRAF = null;
  tunerStream.getTracks().forEach(t => t.stop()); tunerStream = null;
  tunerAnalyser = null; tunerBuf = null;
  const btn = document.getElementById('tunerBtn');
  if (btn) { btn.textContent = 'チューニング開始'; btn.classList.remove('stop'); }
}

// ===== Mode switching =====
// ===== Sketch =====
(function() {
  const NOTES_SK = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  let skBPM = 80, skPlaying = false;
  let skSchedTimer = null, skNextTime = 0, skNextBeat = 0, skNextChord = 0, skBar = 0;
  let skChords = [];
  let skBoardBuilt = false;

  function skEl(id) { return document.getElementById(id); }

  function ensureSkBoard() {
    if (skBoardBuilt) return;
    boardC.buildFretboard(); boardC.buildLegend();
    skBoardBuilt = true;
  }

  function buildSkChords() {
    const key = skEl('sketchKey').value;
    const prog = skEl('sketchProg').value;
    const custom = prog === 'custom';
    skEl('sketchCustomRow').hidden = !custom;
    if (custom) {
      skChords = Array.from(skEl('sketchCustomSlots').querySelectorAll('.sketch-custom-slot select')).map(s => s.value);
    } else {
      const root = PROG_KEY_NI[key] ?? 0;
      skChords = (PROGRESSIONS[prog] || []).map(({d, q}) => {
        const ni = (root + d) % 12;
        return NOTES_SK[ni] + q;
      });
    }
    renderSkChords();
  }

  function renderSkChords() {
    const area = skEl('sketchChords');
    area.innerHTML = '';
    skChords.forEach((c, i) => {
      const chip = document.createElement('div');
      chip.className = 'sketch-chord-chip' + (i === skNextChord && skPlaying ? ' active' : '');
      chip.textContent = c;
      area.appendChild(chip);
    });
  }

  function skScheduleClick(ctx, time, isDown) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'square'; osc.frequency.value = isDown ? 880 : 660;
    gain.gain.setValueAtTime(isDown ? 0.25 : 0.12, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(time); osc.stop(time + 0.08);
  }

  function skUpdateDots(beat) {
    document.querySelectorAll('#sketchBeatDots .metro-beat-dot').forEach((d, i) => d.classList.toggle('active', i === beat));
  }

  function skScheduler() {
    const ctx = ensureAudio();
    const bpc = parseInt(skEl('skBarsPerChord').value);
    while (skNextTime < ctx.currentTime + 0.12) {
      const isDown = skNextBeat === 0;
      skScheduleClick(ctx, skNextTime, isDown);
      const bt = skNextBeat, nt = skNextTime;
      setTimeout(() => skUpdateDots(bt), Math.max(0, (nt - ctx.currentTime) * 1000 - 20));
      if (isDown && skChords.length > 0 && skBar % bpc === 0) {
        const ci = (skBar / bpc) % skChords.length | 0;
        const delay = Math.max(0, (nt - ctx.currentTime) * 1000);
        setTimeout(() => { skNextChord = ci; renderSkChords(); boardC.showChord(skChords[ci]); }, delay);
      }
      if (isDown) skBar++;
      skNextBeat = (skNextBeat + 1) % 4;
      skNextTime += 60 / skBPM;
    }
  }

  function skStart() {
    ensureSkBoard();
    const ctx = ensureAudio();
    skBar = 0; skNextBeat = 0; skNextChord = 0; skNextTime = ctx.currentTime + 0.05;
    skSchedTimer = setInterval(skScheduler, 25);
    skPlaying = true;
    skEl('sketchPlayBtn').textContent = '■ 停止';
    skEl('sketchPlayBtn').classList.add('active');
  }

  function skStop() {
    if (skSchedTimer) { clearInterval(skSchedTimer); skSchedTimer = null; }
    skPlaying = false;
    skEl('sketchPlayBtn').textContent = '▶ ループ再生';
    skEl('sketchPlayBtn').classList.remove('active');
    document.querySelectorAll('#sketchBeatDots .metro-beat-dot').forEach(d => d.classList.remove('active'));
    boardC.clearAll();
    renderSkChords();
  }

  window.skStop = skStop;
  window.ensureSkBoard = ensureSkBoard;

  function skAdjBPM(d) {
    skBPM = Math.max(40, Math.min(220, skBPM + d));
    skEl('skBpmVal').textContent = skBPM;
    if (skPlaying) { skStop(); skStart(); }
  }

  function skAddCustomSlot(val) {
    const slots = skEl('sketchCustomSlots');
    const wrap = document.createElement('div'); wrap.className = 'sketch-custom-slot';
    const sel = document.createElement('select'); sel.className = 'scale-select';
    Object.values(CHORD_FORMS).length; // ensure CHORD_FORMS loaded
    const allChords = Object.keys(CHORD_FORMS);
    allChords.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; if (c === (val || 'C')) o.selected = true; sel.appendChild(o); });
    sel.onchange = buildSkChords;
    const rm = document.createElement('button'); rm.textContent = '✕'; rm.onclick = () => { wrap.remove(); buildSkChords(); };
    wrap.appendChild(sel); wrap.appendChild(rm); slots.appendChild(wrap);
    buildSkChords();
  }

  function skSave() {
    const data = {
      title: skEl('sketchTitle').value,
      key: skEl('sketchKey').value,
      prog: skEl('sketchProg').value,
      customChords: skChords,
      bpm: skBPM,
      bpc: skEl('skBarsPerChord').value,
      memo: skEl('sketchMemo').value,
    };
    try { localStorage.setItem('onpush-sketch', JSON.stringify(data)); } catch(e) {}
    const msg = skEl('sketchSavedMsg'); msg.textContent = '保存しました'; msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  }

  function skLoad() {
    try {
      const raw = localStorage.getItem('onpush-sketch'); if (!raw) return;
      const d = JSON.parse(raw);
      if (d.title) skEl('sketchTitle').value = d.title;
      if (d.key) skEl('sketchKey').value = d.key;
      if (d.memo) skEl('sketchMemo').value = d.memo;
      if (d.bpm) { skBPM = d.bpm; skEl('skBpmVal').textContent = skBPM; }
      if (d.bpc) skEl('skBarsPerChord').value = d.bpc;
      if (d.prog) {
        skEl('sketchProg').value = d.prog;
        if (d.prog === 'custom' && d.customChords) d.customChords.forEach(c => skAddCustomSlot(c));
      }
    } catch(e) {}
    buildSkChords();
  }

  document.getElementById('skBpmDn').onclick = () => skAdjBPM(-5);
  document.getElementById('skBpmUp').onclick = () => skAdjBPM(+5);
  document.getElementById('sketchKey').addEventListener('change', buildSkChords);
  document.getElementById('sketchProg').addEventListener('change', () => { skEl('sketchCustomSlots').innerHTML = ''; buildSkChords(); });
  document.getElementById('sketchAddChord').onclick = () => skAddCustomSlot();
  document.getElementById('sketchPlayBtn').onclick = () => { if (skPlaying) skStop(); else { buildSkChords(); skStart(); } };
  document.getElementById('sketchSaveBtn').onclick = skSave;
  skLoad();
})();

function setMode(m) {
  mode=m; boardA.clearAll(); stopTuner();
  boardA.stopProgAuto(); boardB.stopProgAuto();
  boardA.stopMetroAll(); boardB.stopMetroAll();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));
  document.querySelector('.tab.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  const scoreBar=document.getElementById('scoreBar');
  const nextBtn=document.getElementById('nextBtn');
  const bSection=document.getElementById('b-section');
  const bDivider=document.getElementById('boardDivider');
  const aTagRow=document.getElementById('a-tag-row');
  const aSection=document.getElementById('a-section');
  const tunerArea=document.getElementById('tunerArea');
  nextBtn.classList.remove('visible');

  const sketchArea=document.getElementById('sketchArea');
  if(m==='tuner') {
    scoreBar.hidden=true; aSection.hidden=true; bSection.hidden=true; bDivider.hidden=true;
    document.getElementById('promptArea').innerHTML='';
    document.getElementById('choicesArea').innerHTML='';
    document.getElementById('a-controls').innerHTML='';
    tunerArea.hidden=false; sketchArea.hidden=true; updateTunerUI(null);
  } else if(m==='sketch') {
    scoreBar.hidden=true; aSection.hidden=true; bSection.hidden=true; bDivider.hidden=true;
    document.getElementById('promptArea').innerHTML='';
    document.getElementById('choicesArea').innerHTML='';
    document.getElementById('a-controls').innerHTML='';
    tunerArea.hidden=true; sketchArea.hidden=false;
    if(window.ensureSkBoard) window.ensureSkBoard();
  } else {
    tunerArea.hidden=true; sketchArea.hidden=true; aSection.hidden=false;
    if(window.skStop) window.skStop();
    if(m==='explore') {
      scoreBar.hidden=true;
      document.getElementById('promptArea').innerHTML='<p class="explore-hint">クリックで音名と音が出るよ（もう一度で消える）</p>';
      aTagRow.hidden=false; bSection.hidden=false; bDivider.hidden=false;
      boardA.renderExploreControls(document.getElementById('a-controls'));
      boardA.clearAll(); boardA.resetStringLabels(); boardA.updateLegend(null,null);
      boardB.renderExploreControls(document.getElementById('b-controls'));
      boardB.clearAll(); boardB.resetStringLabels(); boardB.updateLegend(null,null);
      document.getElementById('choicesArea').innerHTML='';
    } else {
      scoreBar.hidden=false;
      aTagRow.hidden=true; bSection.hidden=true; bDivider.hidden=true;
      document.getElementById('a-controls').innerHTML='';
      score={ok:0,ng:0}; boardA.resetStringLabels(); boardA.updateLegend(null,null);
      updateScore(); quiz=null; nextQuestion();
    }
  }
}

// ===== Board B toggle =====
function toggleBoardB() {
  const body = document.getElementById('b-body');
  const btn  = document.getElementById('bToggleBtn');
  const isOn = body.style.display !== 'none';
  body.style.display = isOn ? 'none' : '';
  btn.textContent = isOn ? 'OFF' : 'ON';
  btn.classList.toggle('is-off', isOn);
}

// ===== Init =====
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));
document.getElementById('nextBtn').addEventListener('click', nextQuestion);
boardA.buildFretboard(); boardA.buildLegend();
boardB.buildFretboard(); boardB.buildLegend();
setMode('explore');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

</script>
